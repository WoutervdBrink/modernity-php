services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command: php artisan serve --host=0.0.0.0 --port=8000
        env_file:
            - .env
        ports:
            - "${APP_PORT:-8000}:8000"
        depends_on:
            postgres:
                condition: service_healthy
        init: true

    worker:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command:
            - php
            - artisan
            - queue:work
            - --sleep=1
            - --tries=3
            - --timeout=0
        env_file:
            - .env
        depends_on:
            postgres:
                condition: service_healthy
        init: true
        restart: unless-stopped

    postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        environment:
            POSTGRES_DB: "${DB_DATABASE:-modernity}"
            POSTGRES_USER: "${DB_USERNAME:-modernity}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-modernity}"
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test:
              [
                  "CMD-SHELL",
                  "pg_isready -U ${DB_USERNAME:-modernity} -d ${DB_DATABASE:-modernity}"
              ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 5s

volumes:
    postgres_data:
